# Mutinynet (github.com/MutinyWallet/mutiny-net, .env.mutinynet + gen-bitcoind-conf.sh).
# No RPC password: bitcoind writes a cookie file and lnd reads it; RPC and ZMQ are loopback only.
signet=1
server=1
printtoconsole=1
[signet]
signetchallenge=512102f7561d208dd9ae99bf497273e16f389bdbd6c4742ddb8e6b216e64fa2928ad8f51ae
signetblocktime=30
addnode=45.79.52.207:38333
dnsseed=0
# Outbound P2P only.
listen=0
discover=0
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333
# Mutinynet relays below 1 sat/vB; match it so our transactions propagate the same way.
minrelaytxfee=0.00000100
fallbackfee=0.0002
