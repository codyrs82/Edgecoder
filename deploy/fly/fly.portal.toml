app = "edgecoder-portal"
primary_region = "ord"
# A deploy or restart lets streamed model calls finish (up to 90 s, src/portal/server.ts) and ends
# the rest with a retryable error instead of cutting them; Fly kills the process after this.
kill_signal = "SIGTERM"
kill_timeout = 100

[build]
  dockerfile = "../docker/Dockerfile.server"

[processes]
  app = "node dist/cli/edgecoder.js portal"

[env]
  NODE_ENV = "production"
  # #5: services bind 127.0.0.1 unless HOST is set. Required secrets are listed in #5 / env docs.
  HOST = "0.0.0.0"
  PORTAL_PUBLIC_URL = "https://edgecoder.io"
  PASSKEY_RP_ID = "edgecoder.io"
  PASSKEY_ORIGIN = "https://edgecoder.io"
  # #34: canonical docs host is GitHub Pages behind the custom domain.
  DOCS_SITE_URL = "https://docs.edgecoder.io/"
  # #35: ordered list; the portal uses the first healthy one (cached 60 s). Custom domains with
  # Fly-issued certs (dns-only CNAMEs -> the seed apps); US primary, EU fallback.
  COORDINATOR_DISCOVERY_URLS = "https://coordinator.edgecoder.io,https://coordinator-eu.edgecoder.io"
  # Signed coordinator registry (src/portal/coordinator-registry.ts): the US and EU seeds as platform
  # members, `peerId:fingerprint@url=region` from each seed's GET /identity trustEntry. Written to the
  # portal Postgres as active members. The registry is served only once REGISTRY_SIGNING_KEY_PEM is set
  # (a secret, generated offline).
  REGISTRY_SEEDS = "coord-25bacdd7b3f3:ef50370733f0c02751c1617e6e66eca1bcb641542c82098a3479eac7ef59b3a8@https://coordinator.edgecoder.io=us,coord-b17fb990ea6b:df0500ee7020c4f3ea0676762b8dbe66a4ac7f4820707b00ee17b1cf36637ed9@https://coordinator-eu.edgecoder.io=eu"
  # Portal admins (coordinator ops + admin APIs) are not set here. Set the comma-separated
  # allowlist as a secret so it stays out of the repo:
  #   fly secrets set SYSTEM_ADMIN_EMAILS=admin@example.com,ops@example.com -a <portal app>

[http_service]
  internal_port = 4310
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks]
  [checks.portal_health]
    type = "http"
    port = 4310
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
