app = "edgecoder-portal"
primary_region = "ord"

[build]
  dockerfile = "../docker/Dockerfile.server"

[processes]
  app = "node dist/portal/server.js"

[env]
  NODE_ENV = "production"
  # #5: services bind 127.0.0.1 unless HOST is set. Required secrets are listed in #5 / env docs.
  HOST = "0.0.0.0"
  PORTAL_PUBLIC_URL = "https://edgecoder.io"
  PASSKEY_RP_ID = "edgecoder.io"
  PASSKEY_ORIGIN = "https://edgecoder.io"
  # #34: canonical docs host is GitHub Pages (project site, VitePress base /Edgecoder/).
  DOCS_SITE_URL = "https://codyrs82.github.io/Edgecoder/"
  # #35: ordered list; the portal uses the first healthy one (cached 60 s). Reorder once #33/#31
  # decide which seed is live (edgecoder-seed.fly.dev is NXDOMAIN today).
  COORDINATOR_DISCOVERY_URLS = "https://edgecoder-seed-eu.fly.dev,https://edgecoder-seed.fly.dev"

[http_service]
  internal_port = 4310
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks]
  [checks.portal_health]
    type = "http"
    port = 4310
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
