app = "edgecoder-seed-eu"
primary_region = "cdg"

[processes]
  # #9: the agent image entrypoint starts Ollama in the background.
  app = "node dist/index.js"

[build]
  dockerfile = "../docker/Dockerfile.agent"

[env]
  NODE_ENV = "production"
  # #5: services bind 127.0.0.1 unless HOST is set. Required secrets are listed in #5 / env docs.
  HOST = "0.0.0.0"
  # #43: production requires LIGHTNING_PROVIDER=lnd|cln (+ LND_*/CLN_* via fly secrets).
  # Payments stay off until a Lightning node is configured; flip to "true" with those secrets set.
  ECONOMY_PAYMENTS_ENABLED = "false"
  EDGE_RUNTIME_MODE = "all-in-one"
  NETWORK_MODE = "public_mesh"
  COORDINATOR_PUBLIC_URL = "https://edgecoder-seed-eu.fly.dev"
  LOCAL_MODEL_PROVIDER = "ollama-local"
  OLLAMA_AUTO_INSTALL = "true"
  OLLAMA_MODEL = "qwen2.5:7b"

[http_service]
  internal_port = 4301
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[mounts]
  source = "ollama_data_eu"
  destination = "/data/ollama" # #9: OLLAMA_MODELS; volume must be owned by uid 1000 (node)

[[vm]]
  memory = "8192mb"
  cpu_kind = "performance"
  cpus = 2
