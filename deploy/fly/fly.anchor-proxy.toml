app = "edgecoder-anchor-proxy"
primary_region = "ord"

[processes]
  app = "node dist/economy/anchor-proxy-service.js"

[build]
  dockerfile = "../../Dockerfile.anchor-proxy"

[env]
  NODE_ENV = "production"
  # #5: services bind 127.0.0.1 unless HOST is set. Required secrets are listed in #5 / env docs.
  HOST = "0.0.0.0"
  BITCOIN_NETWORK = "bitcoin"
  ANCHOR_PROXY_PORT = "4311"
  MAX_BROADCASTS_PER_MINUTE = "10"

[http_service]
  internal_port = 4311
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# #14: /health is unauthenticated and returns 503 when bitcoind is unreachable.
[checks]
  [checks.anchor_proxy_health]
    type = "http"
    port = 4311
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
