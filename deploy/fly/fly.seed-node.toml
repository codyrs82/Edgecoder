app = "edgecoder-seed"
primary_region = "ord"

[processes]
  app = "node dist/cli/edgecoder.js all-in-one"

[build]
  dockerfile = "../docker/Dockerfile.agent"

[env]
  NODE_ENV = "production"
  # #5: services bind 127.0.0.1 unless HOST is set. Required secrets are listed in #5 / env docs.
  HOST = "0.0.0.0"
  # Re-execute a sample of deterministic (code) results so fake work is caught and not paid.
  RESULT_VERIFICATION_RATE = "0.05"
  # #43: production requires LIGHTNING_PROVIDER=lnd|cln (+ LND_*/CLN_* via fly secrets).
  # Signet phase: payouts run against the Mutinynet node (deploy/lnd-signet) over Fly 6PN.
  # LND_MACAROON_HEX and LND_TLS_CERT_BASE64 are Fly secrets (deploy/lnd-signet/connect-seeds.sh).
  # Before mainnet follow docs/going-to-mainnet.md: this URL, the secrets and BITCOIN_NETWORK all change.
  ECONOMY_PAYMENTS_ENABLED = "true"
  LIGHTNING_PROVIDER = "lnd"
  LND_REST_URL = "https://lnd.process.edgecoder-lnd.internal:8080"
  BITCOIN_NETWORK = "bitcoin"
  PAYOUT_MAX_SINGLE_SATS = "100000"
  PAYOUT_MAX_ACCOUNT_DAILY_SATS = "500000"
  PAYOUT_MAX_GLOBAL_DAILY_SATS = "2000000"
  EDGE_RUNTIME_MODE = "all-in-one"
  NETWORK_MODE = "public_mesh"
  COORDINATOR_PUBLIC_URL = "https://coordinator.edgecoder.io"
  # #39 (owner decision): the US seed is coordinator-only. It runs no model: no Ollama, no
  # embedded worker (Fly machines have no Docker, so the worker could never pass the
  # SANDBOX_MODE=docker check anyway). Compute comes from enrolled agents; portal chat that
  # needs a coordinator-hosted model is served by a seed that has one (edgecoder-seed-eu),
  # chosen by the portal's capacity check. LOCAL_MODEL_PROVIDER / OLLAMA_* are therefore
  # unset, and SKIP_OLLAMA stops the agent image entrypoint from starting an empty Ollama.
  DISABLE_SELF_AGENT = "1"
  SKIP_OLLAMA = "true"
  # Every agent build since 1.4.7 signs its /mesh/ws bind; unsigned binds are refused.
  MESH_WS_REQUIRE_SIGNED = "true"
  # Fee-pool payouts for this seed's infrastructure go to the Lightning node it pays out from.
  # Signet: the edgecoder-lnd-signet node. Changes with LND_REST_URL at mainnet (docs/going-to-mainnet.md).
  INFRA_HOST_LIGHTNING_NODE_ID = "0206e2ae0952bdbb38d4478eb0bb570ab9019eca0256a77438c6322c9df4d8b75c"

[http_service]
  internal_port = 4301
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.seed_health]
    type = "http"
    port = 4301
    path = "/health/runtime"
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  memory = "16384mb"
  cpu_kind = "performance"
  cpus = 2
