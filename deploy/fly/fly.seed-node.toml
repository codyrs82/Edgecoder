app = "edgecoder-seed"
primary_region = "ord"

[processes]
  app = "node dist/cli/edgecoder.js all-in-one"

[build]
  dockerfile = "../docker/Dockerfile.agent"

[env]
  NODE_ENV = "production"
  # #5: services bind 127.0.0.1 unless HOST is set. Required secrets are listed in #5 / env docs.
  HOST = "0.0.0.0"
  # #43: production requires LIGHTNING_PROVIDER=lnd|cln (+ LND_*/CLN_* via fly secrets).
  # Regtest phase: payouts run against the test Lightning hub (deploy/lnd-test) over Fly 6PN.
  # LND_MACAROON_HEX and LND_TLS_CERT_BASE64 are Fly secrets (deploy/lnd-test/connect-seeds.sh).
  # Before mainnet follow docs/going-to-mainnet.md: this URL, the secrets and BITCOIN_NETWORK all change.
  ECONOMY_PAYMENTS_ENABLED = "true"
  LIGHTNING_PROVIDER = "lnd"
  LND_REST_URL = "https://hub.process.edgecoder-lnd-test.internal:8080"
  BITCOIN_NETWORK = "regtest"
  PAYOUT_MAX_SINGLE_SATS = "100000"
  PAYOUT_MAX_ACCOUNT_DAILY_SATS = "500000"
  PAYOUT_MAX_GLOBAL_DAILY_SATS = "2000000"
  EDGE_RUNTIME_MODE = "all-in-one"
  NETWORK_MODE = "public_mesh"
  COORDINATOR_PUBLIC_URL = "https://coordinator.edgecoder.io"
  LOCAL_MODEL_PROVIDER = "ollama-local"
  OLLAMA_AUTO_INSTALL = "true"
  OLLAMA_MODEL = "qwen3.5:9b"
  # #39: Fly machines have no Docker, so the embedded worker could never pass the sandbox
  # check (SANDBOX_MODE=docker). Seeds are coordinator + Ollama chat only; compute comes
  # from enrolled agents. Ollama itself is started by the agent image entrypoint (#9).
  DISABLE_SELF_AGENT = "1"
  # Every agent build since 1.4.7 signs its /mesh/ws bind; unsigned binds are refused.
  MESH_WS_REQUIRE_SIGNED = "true"
  # Fee-pool payouts for this seed's infrastructure go to the Lightning node it pays out from.
  # Regtest: the edgecoder-lnd-test hub. Changes with LND_REST_URL at mainnet (docs/going-to-mainnet.md).
  INFRA_HOST_LIGHTNING_NODE_ID = "03787c6d8d1b0a4b2abb79f4ba18cf89e333f59911cc84c69e06132b78c3f19878"

[http_service]
  internal_port = 4301
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[mounts]
  source = "ollama_data"
  destination = "/data/ollama" # #9: OLLAMA_MODELS; volume must be owned by uid 1000 (node)

[checks]
  [checks.seed_health]
    type = "http"
    port = 4301
    path = "/health/runtime"
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  memory = "16384mb"
  cpu_kind = "performance"
  cpus = 2
