# Mainnet Lightning node for the coordinators (see Dockerfile and README.md). Real funds.
# External mode (BITCOIND_MODE below): lnd's chain backend is the owner's Bitcoin Knots node
# `ocean-node` in Azure, reached over Fly's private network as a WireGuard peer of the edgecoder
# org. README: "External Bitcoin node".
#   lnd       the coordinators' payout/invoice node; REST (8080) on the private network only,
#             P2P (9735) public so other nodes can open channels to it
#   bitcoind  the old pruned Bitcoin Core. STOPPED in external mode, not destroyed: its process
#             group, volume and VM size stay declared here so no `fly deploy` can remove the
#             machine. It is the rollback (README: "Rollback"). Always deploy external mode with
#             `fly deploy --process-groups lnd`, so the bitcoind machine is not touched.
# The coordinators reach lnd at https://lnd.process.edgecoder-lnd.internal:8080 over Fly's 6PN.
app = "edgecoder-lnd"
primary_region = "ord" # next to edgecoder-seed and edgecoder-pg

[build]
  dockerfile = "Dockerfile"

[processes]
  bitcoind = "bitcoind"
  lnd = "lnd"

[env]
  LND_ALIAS = "edgecoder"
  # LND_EXTERNAL_IP unset and the public 9735 service below disabled: peers reached through Fly's
  # TCP proxy dropped every ~5 min (pong failures), taking the ACINQ channel offline. The node
  # connects outbound only (direct egress) and advertises no address. To accept inbound peers
  # again, uncomment the services block and set LND_EXTERNAL_IP = "37.16.0.48" (still allocated).
  # lnd's backend: external (ocean-node) or bundled (this app's bitcoind machine, the rollback).
  BITCOIND_MODE = "external"
  BITCOIND_LABEL = "ocean-node"  # names the backend in logs only
  # ocean-node's 6PN address as a WireGuard peer of the edgecoder org (peer ocean-node-lnd).
  # The entrypoint adds the IPv6 brackets: rpchost [fdaa:...]:8332.
  BITCOIND_HOST = "fdaa:ec:ae3e:a7b:9016:7eba:d6ac:1b02"
  BITCOIND_RPC_PORT = "8332"
  # ZMQ by the peer's 6PN DNS name (resolves to the address above): lnd v0.21.8's ZMQ client cannot
  # parse a bracketed IPv6 URL ("missing ']' in address"). RPC keeps the address; it works.
  BITCOIND_ZMQ_BLOCK = "tcp://ocean-node-lnd._peer.internal:28332"
  BITCOIND_ZMQ_TX = "tcp://ocean-node-lnd._peer.internal:28333"
  BITCOIND_ESTIMATEMODE = "ECONOMICAL"
  # Secrets (fly secrets list -a edgecoder-lnd): BITCOIND_RPC_USER, BITCOIND_RPC_PASS (the limited
  # `lnd-edgecoder` user on ocean-node), LND_WALLET_PASS. BTC_RPC_PASS is used by the bitcoind
  # machine and by lnd in bundled mode; keep it while the rollback is wanted.
  # Used by the bitcoind machine only:
  BITCOIN_PRUNE_MB = "50000"   # keeps ~50 GB of blocks
  BITCOIN_DBCACHE_MB = "2000"

[[mounts]]
  source = "btcdata"
  destination = "/data"
  initial_size = "80gb"
  processes = ["bitcoind"]

[[mounts]]
  source = "lnddata"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 30 # days; the wallet db and channel state (encrypted by the wallet password)
  processes = ["lnd"]

# Lightning P2P, public. Needs a dedicated IPv4 (fly ips allocate-v4); IPv6 works without one.
# [[services]]
#   internal_port = 9735
#   protocol = "tcp"
#   processes = ["lnd"]
#   auto_stop_machines = "off"
#   auto_start_machines = false
#   min_machines_running = 1
#   [[services.ports]]
#     port = 9735
#   [[services.tcp_checks]]
#     interval = "30s"
#     timeout = "5s"
#     grace_period = "60s"

[[vm]]
  processes = ["bitcoind"]
  size = "shared-cpu-4x"
  memory = "4gb"

[[vm]]
  processes = ["lnd"]
  # Unchanged for the first external-mode deploy. Without a local bitcoind, lnd alone may fit
  # shared-cpu-1x with 1gb; move down only after a week of memory graphs shows the headroom.
  size = "shared-cpu-2x"
  memory = "2gb"
