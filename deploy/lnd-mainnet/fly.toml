# Mainnet Lightning node for the coordinators (see Dockerfile and README.md). Real funds.
# External mode (the default): one machine, `lnd`, whose chain backend is the owner's unpruned
# Bitcoin Core `ocean-node` in Azure, reached over Fly's private network as a WireGuard peer of
# the edgecoder org. No bitcoind runs in this app. README: "External Bitcoin node".
#   lnd   the coordinators' payout/invoice node; REST (8080) on the private network only,
#         P2P (9735) public so other nodes can open channels to it
# The coordinators reach it at https://lnd.process.edgecoder-lnd.internal:8080 over Fly's 6PN.
#
# Fallback: fly.bundled.toml runs the old pruned bitcoind machine next to lnd
# (`fly deploy -c fly.bundled.toml`). Its `btcdata` volume is not mounted here but is kept, so
# that fallback does not need a fresh sync; README says how to remove it and what it costs.
app = "edgecoder-lnd"
primary_region = "ord" # next to edgecoder-seed and edgecoder-pg

[build]
  dockerfile = "Dockerfile"

[processes]
  lnd = "lnd"

[env]
  LND_ALIAS = "edgecoder"
  LND_EXTERNAL_IP = "37.16.0.48" # the app's dedicated IPv4 (README step 1), so peers can find the node
  BITCOIND_MODE = "external"
  BITCOIND_LABEL = "ocean-node"  # names the backend in logs only
  # ocean-node's 6PN address (fdaa:..., brackets optional) or its private DNS name
  # (<peer name>._peer.internal). Set it from the WireGuard peer before deploying.
  BITCOIND_HOST = "REPLACE_WITH_OCEAN_NODE_6PN_ADDRESS"
  BITCOIND_RPC_PORT = "8332"
  # ZMQ defaults to tcp://[BITCOIND_HOST]:28332 (rawblock) and :28333 (rawtx). Set these only if
  # ocean-node publishes elsewhere:
  # BITCOIND_ZMQ_BLOCK = "tcp://[fdaa:...]:28332"
  # BITCOIND_ZMQ_TX = "tcp://[fdaa:...]:28333"
  BITCOIND_ESTIMATEMODE = "ECONOMICAL"
  # Secrets (fly secrets list -a edgecoder-lnd): BITCOIND_RPC_USER, BITCOIND_RPC_PASS (the limited
  # `lnd-edgecoder` user on ocean-node), LND_WALLET_PASS. BTC_RPC_PASS is used only by
  # fly.bundled.toml; keep it while that fallback is wanted.

[[mounts]]
  source = "lnddata"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 30 # days; the wallet db and channel state (encrypted by the wallet password)
  processes = ["lnd"]

# Lightning P2P, public. Needs a dedicated IPv4 (fly ips allocate-v4); IPv6 works without one.
[[services]]
  internal_port = 9735
  protocol = "tcp"
  processes = ["lnd"]
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 9735
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  processes = ["lnd"]
  # Unchanged for the first external-mode deploy. Without a local bitcoind, lnd alone fits
  # shared-cpu-1x with 1gb (about $7/month in ord instead of about $14); move down once a week of
  # `fly machine status` / Grafana memory shows it peaking well under 1 GB (the graph sync after
  # first start is the high point). If it is OOM-killed, go back to this size.
  size = "shared-cpu-2x"
  memory = "2gb"
