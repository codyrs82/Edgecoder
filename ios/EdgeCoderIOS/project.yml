name: EdgeCoderIOS
options:
  bundleIdPrefix: io.edgecoder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: EdgeCoder
    SWIFT_VERSION: "5.0"
    # Bump CURRENT_PROJECT_VERSION for every TestFlight upload (App Store Connect refuses a repeat).
    CURRENT_PROJECT_VERSION: 37
    MARKETING_VERSION: 1.0.0
targets:
  EdgeCoderIOS:
    type: application
    platform: iOS
    sources:
      - path: EdgeCoderIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.edgecoder.ios
        INFOPLIST_FILE: EdgeCoderIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: EdgeCoderIOS/EdgeCoderIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # The Apple Developer team that signs the app (the owner sets it; see docs/ios-app-store-release.md).
        DEVELOPMENT_TEAM: 63CL88WY7G
        TARGETED_DEVICE_FAMILY: "1,2"
        # Buying cSats in the app (Core/PurchasePolicy.swift): none | link-out-us | in-app-lightning.
        # Release (TestFlight / App Store) ships `none` for App Store Review Guideline 3.1.1.
        EDGECODER_PURCHASE_MODE: none
      configs:
        Debug:
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
          EDGECODER_PURCHASE_MODE: in-app-lightning
    info:
      path: EdgeCoderIOS/Info.plist
      properties:
        CFBundleDisplayName: EdgeCoder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        EdgeCoderPurchaseMode: $(EDGECODER_PURCHASE_MODE)
        NSBluetoothAlwaysUsageDescription: EdgeCoder uses Bluetooth to share your device's AI compute with nearby machines when internet is unavailable, enabling local AI task execution without a coordinator.
        NSBluetoothPeripheralUsageDescription: EdgeCoder advertises as a Bluetooth peripheral to allow nearby devices to discover and route tasks.
        NSLocalNetworkUsageDescription: EdgeCoder runs a local HTTP server and connects to mesh peers on your network for P2P task routing and execution.
        BGTaskSchedulerPermittedIdentifiers:
          - io.edgecoder.ble-mesh
          - io.edgecoder.inference
          - io.edgecoder.ios.runtime
          - io.edgecoder.ios.heartbeat
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: io.edgecoder.ios.oauth
            CFBundleURLSchemes:
              - edgecoder
        UIBackgroundModes:
          - fetch
          - processing
          - bluetooth-central
          - bluetooth-peripheral
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchStoryboardName: LaunchScreen
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: SwiftLlama
        product: SwiftLlama
  # #64: unit tests for the request signer. Compiles the signer source directly (no host app, no
  # SwiftLlama) so the shared vectors in tests/security/fixtures run in seconds from Xcode:
  #   xcodegen generate && xcodebuild test -scheme EdgeCoderIOSTests -destination 'platform=iOS Simulator,name=iPhone 15'
  EdgeCoderIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EdgeCoderIOSTests
      - path: EdgeCoderIOS/Security/RequestSigner.swift
      # #63: BLE credit-transaction canonical bytes (BLETxV3) for BLETxV3VectorsTests.
      - path: EdgeCoderIOS/Mesh/OfflineLedger.swift
      # API client parsing and the shared-wording ports (chat failures, served line, buy limits).
      - path: EdgeCoderIOS/Core/ChatFailures.swift
      - path: EdgeCoderIOS/Core/ServedFormatter.swift
      - path: EdgeCoderIOS/Core/BuyLimits.swift
      - path: EdgeCoderIOS/Core/PortalChatClient.swift
      - path: EdgeCoderIOS/Core/APIClient.swift
      - path: EdgeCoderIOS/Core/AppConfig.swift
      # Passkey sign-in: request bodies, portal answers, the flow against a mocked portal.
      - path: EdgeCoderIOS/Auth/PasskeyProtocol.swift
      - path: EdgeCoderIOS/Core/Models.swift
      - path: EdgeCoderIOS/Core/PurchasePolicy.swift
      - path: EdgeCoderIOS/Core/Theme.swift
      - path: EdgeCoderIOS/Shared/NetworkBadge.swift
      - path: EdgeCoderIOS/Bots/BotsModels.swift
      - path: EdgeCoderIOS/Machines/MachinesModels.swift
      - path: EdgeCoderIOS/Network/NetworkModels.swift
      - path: EdgeCoderIOS/Network/NetworkFixture.swift
      - path: EdgeCoderIOS/Chat/ChatModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.edgecoder.ios.tests
        GENERATE_INFOPLIST_FILE: YES
packages:
  # #126 review: match the checked-in project (swift-llama-cpp, resolved to 1.2.0 in
  # Package.resolved) and pin it, instead of floating on llama.cpp master.
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp.git
    exactVersion: 1.2.0
schemes:
  EdgeCoderIOS:
    build:
      targets:
        EdgeCoderIOS: all
    run:
      config: Debug
    archive:
      config: Release
  EdgeCoderIOSTests:
    build:
      targets:
        EdgeCoderIOSTests: all
    test:
      config: Debug
      targets:
        - EdgeCoderIOSTests
