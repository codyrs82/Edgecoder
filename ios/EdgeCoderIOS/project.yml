name: EdgeCoderIOS
options:
  bundleIdPrefix: io.edgecoder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: EdgeCoder
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  EdgeCoderIOS:
    type: application
    platform: iOS
    sources:
      - path: EdgeCoderIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.edgecoder.ios
        INFOPLIST_FILE: EdgeCoderIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: EdgeCoderIOS/EdgeCoderIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R68RHRM2H4
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
    info:
      path: EdgeCoderIOS/Info.plist
      properties:
        CFBundleDisplayName: EdgeCoder
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: io.edgecoder.ios.oauth
            CFBundleURLSchemes:
              - edgecoder
        UIBackgroundModes:
          - fetch
          - processing
          - bluetooth-central
          - bluetooth-peripheral
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchStoryboardName: LaunchScreen
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: SwiftLlama
        product: SwiftLlama
  # #64: unit tests for the request signer. Compiles the signer source directly (no host app, no
  # SwiftLlama) so the shared vectors in tests/security/fixtures run in seconds from Xcode:
  #   xcodegen generate && xcodebuild test -scheme EdgeCoderIOSTests -destination 'platform=iOS Simulator,name=iPhone 15'
  EdgeCoderIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EdgeCoderIOSTests
      - path: EdgeCoderIOS/Security/RequestSigner.swift
      # #63: BLE credit-transaction canonical bytes (BLETxV3) for BLETxV3VectorsTests.
      - path: EdgeCoderIOS/Mesh/OfflineLedger.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.edgecoder.ios.tests
        GENERATE_INFOPLIST_FILE: YES
packages:
  # #126 review: match the checked-in project (swift-llama-cpp, resolved to 1.2.0 in
  # Package.resolved) and pin it, instead of floating on llama.cpp master.
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp.git
    exactVersion: 1.2.0
schemes:
  EdgeCoderIOS:
    build:
      targets:
        EdgeCoderIOS: all
    run:
      config: Debug
    archive:
      config: Release
  EdgeCoderIOSTests:
    build:
      targets:
        EdgeCoderIOSTests: all
    test:
      config: Debug
      targets:
        - EdgeCoderIOSTests
