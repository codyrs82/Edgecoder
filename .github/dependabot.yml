# #13: weekly dependency updates. Minor and patch bumps are grouped per ecosystem to keep the PR count down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      root-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      desktop-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      vscode-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, github-actions]
    groups:
      actions: { patterns: ["*"] }
  # #84: base images are pinned by digest; this entry keeps the pins moving so Node 22 and
  # Debian security patches reach rebuilds. One entry with `directories:` and one group means
  # every image bump across all four folders lands in a single PR, and
  # tests/repo/docker-digests.test.ts fails if the node digest ever differs between Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/docker
      - /docker
      - /tests/e2e
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    # Digest and minor/patch refreshes only. A Node major (e.g. node:26) is a runtime upgrade,
    # not a base-image refresh: package.json pins engines to ">=22.12 <25", better-sqlite3's
    # native build fails on it, and tests/repo/docker-digests.test.ts asserts node:22. Do those by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      base-images: { patterns: ["*"] }
