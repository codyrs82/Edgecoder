# #13: weekly dependency updates. Minor and patch bumps are grouped per ecosystem to keep the PR count down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      root-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      desktop-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      vscode-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, github-actions]
    groups:
      actions: { patterns: ["*"] }
  # #84: base images are pinned by digest; these entries keep the pins moving so Node 22 and
  # Debian security patches reach rebuilds. All node:22-bookworm-slim bumps land in one PR per
  # directory (Dependabot groups per directory), and tests/repo/docker-digests.test.ts fails if
  # the node digest ever differs between Dockerfiles, so a partial bump can't merge silently.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    groups:
      base-images: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    groups:
      base-images: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    groups:
      base-images: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /tests/e2e
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    groups:
      base-images: { patterns: ["*"] }
