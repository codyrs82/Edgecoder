name: edgecoder-ci

on:
  push:
  pull_request:

# #7: cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # BLE native modules (@abandonware/noble, bleno) are optionalDependencies:
      # if they can't compile on a runner, npm ci skips them instead of failing.
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - run: npm run test:integration
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: junit.xml
          if-no-files-found: ignore

  debian-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:stable-slim
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y curl git ca-certificates gnupg
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - run: npm run test:integration
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-debian
          path: junit.xml
          if-no-files-found: ignore

  desktop-token-test:
    # #6: unit-test desktop/src-tauri/src/token.rs standalone (the full Tauri
    # crate needs webkit system libraries, so build just the token module).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test token module
        run: |
          mkdir -p /tmp/token-test/src
          cp desktop/src-tauri/src/token.rs /tmp/token-test/src/lib.rs
          printf '[package]\nname = "token-test"\nversion = "0.0.0"\nedition = "2021"\n\n[dependencies]\ngetrandom = "0.2"\nhex = "0.4"\n' > /tmp/token-test/Cargo.toml
          cargo test --manifest-path /tmp/token-test/Cargo.toml
