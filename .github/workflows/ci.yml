name: edgecoder-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  debian-validation:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y curl git ca-certificates gnupg
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm test

  desktop-token-test:
    # #6: unit-test desktop/src-tauri/src/token.rs standalone (the full Tauri
    # crate needs webkit system libraries, so build just the token module).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test token module
        run: |
          mkdir -p /tmp/token-test/src
          cp desktop/src-tauri/src/token.rs /tmp/token-test/src/lib.rs
          printf '[package]\nname = "token-test"\nversion = "0.0.0"\nedition = "2021"\n\n[dependencies]\ngetrandom = "0.2"\nhex = "0.4"\n' > /tmp/token-test/Cargo.toml
          cargo test --manifest-path /tmp/token-test/Cargo.toml
