name: edgecoder-ci

on:
  push:
  pull_request:

# #7: cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # BLE native modules (@abandonware/noble, bleno) are optionalDependencies:
      # if they can't compile on a runner, npm ci skips them instead of failing.
      - run: npm ci
      - run: npm run check:scripts
      - run: npm run check:fly-configs
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: junit.xml
          if-no-files-found: ignore

  debian-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:stable-slim
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y curl git ca-certificates gnupg
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-debian
          path: junit.xml
          if-no-files-found: ignore

  credits-pg:
    # #48 (and later economy fixes): tests that need a real Postgres for locking/transactions.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: credits }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d credits" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: "Postgres-backed credit tests"
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/credits
        run: npx vitest run tests/credits/atomic-debit.test.ts

  desktop-token-test:
    # #6: unit-test desktop/src-tauri/src/token.rs standalone (the full Tauri
    # crate needs webkit system libraries, so build just the token module).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test token module
        run: |
          mkdir -p /tmp/token-test/src
          cp desktop/src-tauri/src/token.rs /tmp/token-test/src/lib.rs
          printf '[package]\nname = "token-test"\nversion = "0.0.0"\nedition = "2021"\n\n[dependencies]\ngetrandom = "0.2"\nhex = "0.4"\n' > /tmp/token-test/Cargo.toml
          cargo test --manifest-path /tmp/token-test/Cargo.toml

  # #11: build the desktop web bundle and make sure the production CSP holds:
  # no eval / new Function in the main-thread JS (Monaco workers are bundled separately).
  desktop-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: No eval in main-thread bundles
        run: |
          set -eu
          ls dist/assets/*.js
          # Worker chunks run in their own (worker) context; check every other chunk.
          main=$(ls dist/assets/*.js | grep -v -E '\.worker-|worker-[A-Za-z0-9_-]+\.js$' || true)
          echo "$main"
          [ -n "$main" ] || { echo "::error::no main-thread chunks found in dist/assets"; exit 1; }
          if grep -l -E 'new Function\(|[^A-Za-z0-9_.$]eval\(' $main; then
            echo "::error::eval/new Function found in a main-thread bundle (blocked by script-src 'self')"
            exit 1
          fi

  # #9: build both images and check them: non-root, no Ollama in the slim image,
  # no tests/, server size budget, and a /health/runtime smoke test.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Throwaway database for the portal smoke test (the portal requires PORTAL_DATABASE_URL).
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: smoke, POSTGRES_PASSWORD: smoke, POSTGRES_DB: portal }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smoke -d portal" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f deploy/docker/Dockerfile.server -t edgecoder-server:ci .
      - name: Build agent image
        run: docker build -f deploy/docker/Dockerfile.agent -t edgecoder-agent:ci .
      - name: Image assertions
        run: |
          set -eu
          for img in edgecoder-server:ci edgecoder-agent:ci; do
            uid=$(docker run --rm --entrypoint id "$img" -u)
            echo "$img uid=$uid"; test "$uid" != "0"
            docker run --rm --entrypoint sh "$img" -c 'test ! -d /app/tests'
          done
          if docker run --rm --entrypoint sh edgecoder-server:ci -c 'command -v ollama'; then
            echo "::error::ollama found in the slim server image"; exit 1
          fi
          docker run --rm --entrypoint ollama edgecoder-agent:ci --version
          # The agent image's real entrypoint must be executable as the non-root user
          # (scale-nonroot caught exit 126 from a 0644 entrypoint).
          docker run --rm -e SKIP_OLLAMA=true edgecoder-agent:ci node -e "process.exit(0)"
          docker run --rm edgecoder-agent:ci sh -c 'test -x /usr/local/bin/docker-entrypoint.sh'
          size=$(docker image inspect edgecoder-server:ci --format '{{.Size}}')
          echo "server image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((300 * 1024 * 1024))
      - name: Smoke test server image
        run: |
          set -eu
          # Throwaway per-run values (not secrets) for the tokens every service requires at startup.
          t() { openssl rand -hex 16; }
          docker run -d --name smoke -p 4301:4301 -e NODE_ENV=development -e HOST=0.0.0.0 \
            -e MESH_AUTH_TOKEN="$(t)" -e ADMIN_API_TOKEN="$(t)" -e INFERENCE_AUTH_TOKEN="$(t)" \
            -e PORTAL_SERVICE_TOKEN="$(t)" -e PAYMENT_WEBHOOK_SECRET="$(t)" \
            -e LOCAL_MODEL_PROVIDER=edgecoder-local -e OLLAMA_AUTO_INSTALL=false -e ECONOMY_PAYMENTS_ENABLED=false \
            edgecoder-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4301/health/runtime; then echo; docker rm -f smoke; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then break; fi
            sleep 2
          done
          docker logs smoke; docker rm -f smoke; exit 1
      - name: Smoke test portal entry on the server image
        run: |
          set -eu
          t() { openssl rand -hex 16; }
          # The portal is what ships on this image (fly.portal.toml runs dist/portal/server.js).
          docker run -d --name portal-smoke --network host -e NODE_ENV=development -e HOST=127.0.0.1 \
            -e PORTAL_DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:5432/portal \
            -e PORTAL_SERVICE_TOKEN="$(t)" -e INFERENCE_AUTH_TOKEN="$(t)" -e MESH_AUTH_TOKEN="$(t)" \
            -e WALLET_SECRET_PEPPER="$(t)" \
            edgecoder-server:ci node dist/portal/server.js
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4310/health; then echo; docker rm -f portal-smoke; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' portal-smoke)" != "true" ]; then break; fi
            sleep 2
          done
          docker logs portal-smoke; docker rm -f portal-smoke; exit 1
      - name: "Vulnerability scan - server image (non-blocking)"
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: edgecoder-server:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: "Vulnerability scan - agent image (non-blocking)"
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: edgecoder-agent:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
