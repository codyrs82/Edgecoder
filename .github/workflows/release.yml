name: edgecoder-release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installer
        run: npm run build:macos-installer

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-installer
          path: build/EdgeCoder-*-macos-installer.pkg
          if-no-files-found: error
          retention-days: 1

  build-linux-deb:
    name: Build Linux .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build Linux .deb package
        run: npm run build:linux-deb

      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-deb
          path: build/EdgeCoder-*-linux-amd64.deb
          if-no-files-found: error
          retention-days: 1

  build-windows-msi:
    name: Build Windows .msi installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install wixl for cross-compiling .msi on Linux
        run: sudo apt-get update && sudo apt-get install -y wixl

      - name: Install dependencies
        run: npm ci

      - name: Stage Windows build
        run: npm run build:windows-msi

      - name: Compile .msi with wixl
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd build/windows
          wixl -o "../EdgeCoder-${VERSION}-windows-x64.msi" edgecoder.wxs

      - name: Upload Windows .msi artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msi
          path: build/EdgeCoder-*-windows-x64.msi
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux-deb, build-windows-msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download macOS installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-installer
          path: release-assets/

      - name: Download Linux .deb package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-deb
          path: release-assets/

      - name: Download Windows .msi installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-msi
          path: release-assets/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for signing
        run: npm run build

      - name: Sign release
        run: bash scripts/sign-release.sh
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          BUILD_DIR: release-assets

      - name: Copy manifest into release assets
        run: |
          cp release-manifest.json release-assets/
          cp release-manifest.sig release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
