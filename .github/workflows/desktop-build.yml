name: desktop-debug-build
# Part of #70: build the packaged desktop app (tauri build --debug) on macOS and Windows,
# and upload the bundles as artifacts. These artifacts are what the packaged-app QA
# (desktop/README.md checklist, #11 CSP, #77 CORS) is run against. Unsigned debug builds
# only; no signing or updater keys are used, and nothing is published.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bundles: app, artifact: "desktop/src-tauri/target/debug/bundle/macos/edgecoder-desktop-debug-macos.tar.gz" }
          - { os: windows-latest, bundles: nsis, artifact: "desktop/src-tauri/target/debug/bundle/nsis/*.exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable # pinned by SHA, so the toolchain must be named explicitly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      # Root deps: the beforeBuildCommand (npm run bundle-agent) builds the agent runtime.
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: tauri build --debug
        working-directory: desktop
        shell: bash
        # The vite build of the Monaco chunk hits Node's default heap limit on the
        # macOS runner (OOM, abort trap 6), so give it more headroom.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        # createUpdaterArtifacts needs the updater signing key; turn it off for CI debug builds.
        run: npx tauri build --debug --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # upload-artifact zips files without Unix modes, which would strip the exec bit
      # from EdgeCoder.app/Contents/MacOS/*. A tarball keeps it.
      - name: Tar macOS .app (keeps the exec bit)
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri/target/debug/bundle/macos
        shell: bash
        run: |
          set -eu
          app=$(ls -d *.app | head -n1)
          [ -n "$app" ] || { echo "::error::no .app bundle produced"; exit 1; }
          tar -czf edgecoder-desktop-debug-macos.tar.gz "$app"
          # bsdtar lists the mode first ("-rwxr-xr-x ... EdgeCoder.app/Contents/MacOS/x"); fail if no executable.
          tar -tvzf edgecoder-desktop-debug-macos.tar.gz | grep -E '^-rwx.*Contents/MacOS/' | head -n 3 || { echo "::error::no executable in Contents/MacOS"; exit 1; }
      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edgecoder-desktop-debug-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
