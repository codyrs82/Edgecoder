name: e2e

# #12: Playwright e2e against the docker-compose stack. Manual + nightly only;
# not required for merge until stable.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:up
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Compose logs
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.e2e.yml logs --no-color > compose.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            tests/e2e/playwright-report/
            compose.log
          if-no-files-found: ignore
      - if: always()
        run: npm run test:e2e:down
