name: e2e

# #12: Playwright e2e against the docker-compose stack. Manual + nightly only;
# not required for merge until stable.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:up
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Compose logs
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.e2e.yml logs --no-color > compose.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            tests/e2e/playwright-report/
            compose.log
          if-no-files-found: ignore
      - if: always()
        run: npm run test:e2e:down
