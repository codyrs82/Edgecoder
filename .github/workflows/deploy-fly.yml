name: Deploy to Fly.io
# #7: deploy only after edgecoder-ci succeeds on main (no separate re-test job).
# workflow_run fires only for the workflow file on the default branch, so this
# takes effect after merge. workflow_run has no `paths` filter: every green CI
# run on main deploys.
#
# DISABLED until #31: the Fly apps were deleted on purpose. Every deploy job is
# gated on the repo variable DEPLOY_ENABLED == 'true', which is intentionally left
# unset, so neither a merge to main nor a manual dispatch can deploy. Re-enable only
# as part of #31 (create the `production` environment first, then set the variable).
on:
  workflow_run:
    workflows: [edgecoder-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  gate:
    # Disabled until #31 (vars.DEPLOY_ENABLED is unset). Manual dispatch only from main.
    if: >-
      ${{ vars.DEPLOY_ENABLED == 'true' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      ) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI green for ${{ github.event.workflow_run.head_sha || github.sha }}"

  deploy-portal:
    needs: gate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }} # disabled until #31
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --config deploy/fly/fly.portal.toml --remote-only
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }

  deploy-coordinator:
    needs: gate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }} # disabled until #31
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --config deploy/fly/fly.toml --remote-only
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }

  deploy-seed:
    needs: gate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }} # disabled until #31
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --config deploy/fly/fly.seed-node.toml --remote-only
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
