name: secret-scan

# #3: full-history secret scanning. Two independent scanners so a miss in one
# rule set is caught by the other:
#   - gitleaks: pattern + entropy scan of every commit (allowlist in .gitleaks.toml)
#   - trufflehog: detector scan that *verifies* candidates against the issuing
#     service, so a hit means "this credential is live right now"
# Run manually (workflow_dispatch) for a full-history scan after a rotation.
on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # PR comment on a finding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the PR tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Only needed for organization-owned repos; a personal repo scans without it.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the PR tip
      # base/head are left empty on purpose: the action derives them from the event
      # (PR base..head, push before..after) and scans the whole history on workflow_dispatch.
      # `--only-verified` is not passed because it overrides `--results` to verified-only
      # and would drop `unknown` (verification attempted but the service did not answer).
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown
