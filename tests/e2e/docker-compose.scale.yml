services:
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-edgecoder}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-edgecoder}
    volumes:
      - scale-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgecoder}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # #96: the seed validates every non-loopback registration against this portal, as in production.
  # scripts/e2e/scale-nonroot.sh creates a verified test user and a portal API key here; each
  # worker enrols itself with that key (scripts/e2e/scale-worker-enroll.sh).
  portal:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    command: ["node", "dist/portal/server.js"]
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - SKIP_OLLAMA=true
      - PORTAL_DATABASE_URL=postgresql://${POSTGRES_USER:-edgecoder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edgecoder}
      # PLACEHOLDERS for local scale tests only; must match the seed's PORTAL_SERVICE_TOKEN.
      - PORTAL_SERVICE_TOKEN=${PORTAL_SERVICE_TOKEN:-scale-test-placeholder-portal-token}
      - WALLET_SECRET_PEPPER=${WALLET_SECRET_PEPPER:-scale-test-placeholder-pepper}
      - RESEND_API_KEY=
    ports:
      - "127.0.0.1:${SCALE_PORTAL_PORT:-4310}:4310"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  seed-node:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    command: ["node", "dist/index.js"]
    environment:
      - NODE_ENV=production
      - EDGE_RUNTIME_MODE=all-in-one
      - DATABASE_URL=postgresql://${POSTGRES_USER:-edgecoder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edgecoder}
      - LOCAL_MODEL_PROVIDER=edgecoder-local
      - OLLAMA_AUTO_INSTALL=false
      - OLLAMA_MODEL=qwen3.5:9b
      # NODE_ENV=production requires these (#5/#42/#43). PLACEHOLDERS for local scale tests only —
      # override via .env; never reuse these values anywhere real.
      - HOST=0.0.0.0
      - MESH_AUTH_TOKEN=${MESH_AUTH_TOKEN:-scale-test-placeholder-mesh-token}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-scale-test-placeholder-admin-token}
      - PORTAL_SERVICE_URL=${PORTAL_SERVICE_URL:-http://portal:4310}
      - PORTAL_SERVICE_TOKEN=${PORTAL_SERVICE_TOKEN:-scale-test-placeholder-portal-token}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-scale-test-placeholder-webhook-secret}
      - INFERENCE_AUTH_TOKEN=${INFERENCE_AUTH_TOKEN:-scale-test-placeholder-inference-token}
      - ECONOMY_PAYMENTS_ENABLED=${ECONOMY_PAYMENTS_ENABLED:-false}
    ports:
      - "4301:4301"
    depends_on:
      postgres:
        condition: service_healthy
      portal:
        condition: service_healthy
    healthcheck:
      # /status requires the mesh token since #40.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4301/status',{headers:{'x-mesh-token':process.env.MESH_AUTH_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    # Enrols with the portal (unique AGENT_ID per replica: worker-<hostname>), then execs the worker.
    command: ["sh", "/scale/worker-enroll.sh"]
    volumes:
      - ../../scripts/e2e/scale-worker-enroll.sh:/scale/worker-enroll.sh:ro
    environment:
      - SCALE_PORTAL_URL=http://portal:4310
      - SCALE_ENROLL_KEY=${SCALE_ENROLL_KEY:-}
      - COORDINATOR_URL=http://seed-node:4301
      - MESH_AUTH_TOKEN=${MESH_AUTH_TOKEN:-scale-test-placeholder-mesh-token}
      - AGENT_MODE=swarm-only
      - LOCAL_MODEL_PROVIDER=edgecoder-local
      - OLLAMA_AUTO_INSTALL=false
      - OLLAMA_MODEL=qwen3.5:9b
    depends_on:
      seed-node:
        condition: service_healthy
    deploy:
      replicas: 10

volumes:
  scale-postgres:
