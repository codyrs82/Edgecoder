<!doctype html>
<html><head><meta charset="utf-8"><title>harness</title></head>
<body style="margin:0;padding:200px 40px 40px;background:#0d1117;color:#e6edf3">
<div id="app" style="width:600px"></div>
<script type="module">
  import { mount } from "svelte";
  import ChatInput from "/src/components/ChatInput.svelte";
  window.sent = [];
  const files = [{ path: "src/lib/api.ts", kind: "file" }, { path: "src/lib", kind: "dir" }, { path: "src/App.svelte", kind: "file" }];
  mount(ChatInput, {
    target: document.getElementById("app"),
    props: {
      onSend: (m) => window.sent.push(m),
      mentions: async (q) => files.filter((f) => f.path.includes(q)),
    },
  });
  window.ready = true;
</script>
</body></html>
